apiVersion: v1
kind: Pod
metadata:
  name: cpu-pod-simulation
spec:
  containers:
  - name: cpu-stress-container
    image: polinux/stress-ng
    command: [ "/bin/bash", "-c", "--"]
    args: ["stress-ng --cpu 3 --vm 3 -- vm-bytes 2G --io 3" ]
    resources:
      limits:
        cpu: "4"
      requests:
        cpu: "2"