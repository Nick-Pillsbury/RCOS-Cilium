apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-b-app
  namespace: team-b
spec:
  replicas: 3
  selector:
    matchLabels:
      app: team-b
  template:
    metadata:
      labels:
        app: team-b
    spec:
      containers:
      - name: app
        image: nginx
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: team-b-service
  namespace: team-b
spec:
  selector:
    app: team-b
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
