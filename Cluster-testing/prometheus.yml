global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'cilium'
    kubernetes_sd_configs:
      - role: pod
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'iperf3'
    kubernetes_sd_configs:
      - role: service
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        target_label: job
        regex: iperf3-service
